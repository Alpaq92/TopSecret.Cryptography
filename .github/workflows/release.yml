name: Release

# release-please reads Conventional Commits on master (feat:, fix:, deps:,
# docs:, refactor:, BREAKING CHANGE) and maintains a "Release PR" that bumps
# .release-please-manifest.json and prepends the generated section to
# CHANGELOG.md. The PR is queued for auto-merge, so it lands on its own once
# the required checks are green. Merging it creates the tag + GitHub Release;
# the publish job then packs both NuGet packages at the new tag and pushes to
# NuGet.org.
#
# This is also how the monthly Dependabot dependency refresh (dependabot.yml,
# feat(deps) commit prefix) turns into an actual published release without a
# bespoke "upgrade + deploy" job: Dependabot opens the PR, its own workflow
# auto-merges it once checks pass, the merge to master runs release-please
# here, and a feat(deps) commit is release-worthy — so the auto-merged
# dependency bump becomes a new NuGet version on its own.
#
# Releases created by GITHUB_TOKEN don't trigger `on: release` workflows;
# nothing in this repo currently depends on that, unlike a project with a
# Pages demo to redeploy.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manually publish this existing tag (skips release-please)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open / merge release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      released: ${{ steps.rp.outputs.releases_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge on release PR
        if: steps.rp.outputs.pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  publish:
    name: Pack & publish to NuGet
    runs-on: windows-latest # net462 (a plain .NET Framework TFM) packs cleanly only here
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write # gh release upload
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag || inputs.tag }}"
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The release body (generated by release-please from Conventional
      # Commits) becomes each package's <releaseNotes> on nuget.org:
      # Directory.Build.props reads release_notes.txt when it exists.
      - name: Extract release notes for nuget.org
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ steps.tag.outputs.name }}" --json body --jq .body > release_notes.txt || echo "Release ${{ steps.tag.outputs.name }}" > release_notes.txt

      - name: Restore
        run: dotnet restore TopSecret.Cryptography.sln

      - name: Build
        run: dotnet build TopSecret.Cryptography.sln --configuration Release --no-restore -p:Version=${{ steps.tag.outputs.version }}

      - name: Test (Argon2)
        run: dotnet test TopSecret.Cryptography.Argon2.Test/TopSecret.Cryptography.Argon2.Test.csproj --configuration Release --no-build --verbosity normal

      - name: Test (Blake2)
        run: dotnet test TopSecret.Cryptography.Blake2.Test/TopSecret.Cryptography.Blake2.Test.csproj --configuration Release --no-build --verbosity normal

      # Sln-wide pack emits both IsPackable projects (Argon2, Blake2).
      - name: Pack
        run: dotnet pack TopSecret.Cryptography.sln --configuration Release --no-build -p:PackageVersion=${{ steps.tag.outputs.version }} -o ./nupkg

      # List every entry inside each .nupkg so mis-packs (a TFM dropping out,
      # icon/readme missing) are visible in the log.
      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for pkg in ./nupkg/*.nupkg; do
            found=1
            echo "=== $pkg ==="
            unzip -l "$pkg"
          done
          if [ "$found" -eq 0 ]; then
            echo "No .nupkg files produced" >&2
            exit 1
          fi

      - name: Verify NuGet credentials
        shell: bash
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "NUGET_API_KEY secret is empty or unset — cannot push to NuGet.org." >&2
            echo "Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow with the tag input." >&2
            exit 1
          fi

      # --skip-duplicate makes re-runs safe after a partial push; .snupkg
      # symbol packages are auto-detected and uploaded alongside.
      - name: Push to NuGet.org
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Attach packages to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.name }}" ./nupkg/* --clobber
