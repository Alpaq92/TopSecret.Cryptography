name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# One CI run per ref at a time; a push flurry cancels superseded runs
# instead of stacking them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the only runner that can build net462 (a plain
        # .NET Framework TFM, no cross-compilation reference-assembly
        # assumptions needed). ubuntu-latest gives cross-platform build
        # confidence for the other four TFMs via CI_TFMS (see the csproj
        # files) — no macOS-specific code exists in this library, so a
        # third OS leg wouldn't add coverage, only runner cost.
        include:
          - os: windows-latest
            tfms: ''
          - os: ubuntu-latest
            tfms: netstandard2.0;net6.0;net8.0;net10.0

    env:
      CI_TFMS: ${{ matrix.tfms }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore TopSecret.Cryptography.sln

      - name: Build
        run: dotnet build TopSecret.Cryptography.sln --configuration Release --no-restore

      - name: Test (Argon2)
        run: dotnet test TopSecret.Cryptography.Argon2.Test/TopSecret.Cryptography.Argon2.Test.csproj --configuration Release --no-build --verbosity normal

      - name: Test (Blake2)
        run: dotnet test TopSecret.Cryptography.Blake2.Test/TopSecret.Cryptography.Blake2.Test.csproj --configuration Release --no-build --verbosity normal

  wasm-smoke-test:
    name: WASM smoke test (actually run, not just compile)
    # Not part of the build matrix above / TopSecret.Cryptography.sln: this
    # project targets browser-wasm, which needs the wasm-tools workload the
    # other legs don't install. See gaps.md — source-level inspection alone
    # was judged insufficient to trust the WASM sync-path fix; this job is
    # the actual run that inspection can't substitute for.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build WASM smoke test
        run: dotnet build TopSecret.Cryptography.Argon2.WasmSmokeTest/TopSecret.Cryptography.Argon2.WasmSmokeTest.csproj --configuration Release

      - name: Run on a genuinely single-threaded WASM host
        run: node TopSecret.Cryptography.Argon2.WasmSmokeTest/bin/Release/net10.0/browser-wasm/AppBundle/main.mjs
