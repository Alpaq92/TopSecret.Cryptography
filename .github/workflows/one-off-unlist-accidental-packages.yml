name: One-off — unlist accidentally-published packages

# TEMPORARY, single-use cleanup workflow. ArgonBenchmarks and
# ComparisonHarness (internal dev tools, never meant to be public NuGet
# packages) were accidentally packed and published to NuGet.org as part of
# v1.4.3, because `dotnet pack` packs every project by default unless
# IsPackable=false is set — now fixed on both projects. This workflow
# unlists (NuGet's soft-delete: hides from search/browse, doesn't hard-remove
# the bytes — nothing on NuGet.org ever can be hard-deleted) the two
# already-published copies. Delete this file once it's been run.

on:
  workflow_dispatch:

permissions: {}

jobs:
  unlist:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Unlist ArgonBenchmarks 1.4.3
        run: dotnet nuget delete ArgonBenchmarks 1.4.3 --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --non-interactive

      - name: Unlist ComparisonHarness 1.4.3
        run: dotnet nuget delete ComparisonHarness 1.4.3 --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --non-interactive
